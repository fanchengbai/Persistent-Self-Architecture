[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "persistent-self-architecture"
version = "0.1.0"
description = "Research infrastructure for Persistent Self Architecture experiments"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
rwkv7 = [
  "rwkv==0.8.32",
]

[project.scripts]
psa = "psa.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
